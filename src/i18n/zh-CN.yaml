  title: '段落设置'
  deleteLabel: '删除段落'
  deleted: '已删除段落标记'
  name:
    label: '段落名称（可选）'
    placeholder: '例如：A 段 / 主歌 / 副歌'
  bpm:
    label: '速度'
    hint: '可输入小数，例如 90.5'
  meter:
    label: '拍号'
    beatsTitle: '每小节拍数'
    beatsHint: '分子：每小节几拍'
  unit:
    title: '以几分音符为一拍（当前 {unit} 分音符）'
    menuTitle: '以几分音符为一拍'
    note: '{unit} 分音符'
  # 位置 = 「小节号 + 拍号」两个字段：这里的 label 只是**这一栏的名字**，单位写在**各自那个框里**、
  # 数字的右侧（`NumberPad` 的 `unit`，复用 `unit.measure` / `unit.beat`，与跳转面板同一套），
  # 键盘上不写单位（见 docs/ui.md §18.23）。一个框装两件事时才需要「小节.拍：4.03 = …」
