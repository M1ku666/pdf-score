# 简体中文文案 —— **全站用户可见的文字都在这个文件里**。
#
# 改文案就改这里，然后 `npm run i18n`（predev / prebuild / pretest:unit 会自动跑；
# 开发时改这个文件也会自动重新生成）。生成物是 src/i18n/locales.generated.js，别手改它。
#
# 写法：
#   · 键的层级就是 t() 的点号路径：下面 library → search → placeholder
#     对应 t('library.search.placeholder')。缩进用两个空格，别用 Tab。
#   · 只放用户看得见的字符串：界面文字、按钮、aria-label、placeholder、toast、
#     抛给用户看的 Error.message、下拉选项……代码注释、console.warn、
#     panel-key / 排序 value / localStorage key 这类标识符都不进来。
#   · 动态文案用 {参数名} 占位：t('library.imported', { n: 3 })。
#   · 只有符号没有语义的转义文本（如反复记号的 :‖）也放进来 —— 不同语言未必用同一套记号。
#   · 加一门语言：复制这个文件改成 <语言 code>.yaml，把 _name 与内容换掉即可。
#
# YAML 的坑基本不用操心：值一律按纯文本写，只有真会被当成别的类型时才需要引号
# （以 { 开头、纯数字、1. 这种、含 : 或 # 的）—— 现有值里需要引号的都已经加好了。

_name: 简体中文

# ---------------------------- app · 应用本身（标题栏、document.title） ----------------------------
app:
