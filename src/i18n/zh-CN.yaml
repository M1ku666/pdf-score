# ---------------------------- marks · 标记列表（再点一次已选中的标记工具时弹出的 treeview） ----------------------------
# 结构：**行做父节点**（含没有小节线、推不出小节的行），子节点是挂在这一行上的小节线 / 段落 / 反复。
# 子节点**只有一行字**：小节线写它起头的小节号（`measureAt`）、段落写名字 + 速度拍号
# （**与谱面名牌共用 `i18n/score-text.js` 的 `segmentLabel`**，所以两处永远一致）、
# 反复写类型（复用 `repeatKind.*`）。段落与反复的显示文字都在别处，这里只放这个列表自己的字眼。
marks:
  title: '标记列表'
  empty: '这份乐谱还没有任何标记'
  # 父节点两行：上行「第1页第1行」（两段直接相接，所以这里不写尾空格）、下行是这一行的摘要
  rowAt: ' 第 {n} 行'
  pageAt: '第 {n} 页'
  summary: '{measures} 小节 {segments} 段落 {repeats} 反复'
  # 小节线那个子项：它起头的那一小节（拿不到小节号时退回类型名，见 `type.bar`）
  measureAt: '第 {n} 小节'
  type:
    bar: '小节线'
  # 顶栏那颗「筛选」（上下文菜单：四类标记 + 底下隔着一条分割线的「全部」）。四类那四项的名字与图标
  # **复用工具栏那四个工具**（`store.tool.*.label`），这里只有这颗按钮、菜单标题与「全部」。
  filter:
    label: '筛选'
    title: '筛选标记'
    # 菜单最后一项：**总开关**（勾 = 四档全开着；全亮时再点 = 四档一起关）。
    # 标签恒为「全部」，**不按状态换成「清空」** —— 那与顶栏那颗「清空勾选」撞词
    all: '全部'
    # 「行」那一档关掉、三类子标记又都关着时的空状态（与 `empty` 是两回事：这份乐谱**有**标记）
    empty: '当前筛选下没有可显示的标记'
  # 摊平显示（「行」那一档关掉时）：子项那行字前面补上它落在哪一行，`at` = pageAt + rowAt
  flatAt: '{at} · {line}'
  # 删除前那道居中确认（条数是**真正会被删掉的项数**：勾了整行时子标记不重复计）
  delete:
    title: '删除标记'
    confirm: '确定删除选中的 {n} 处标记吗？'
  deleteOne: '已删除标记'
  deleted: '已删除 {n} 处标记'

