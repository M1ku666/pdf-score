<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 页面缩放全站禁用：这两档 Android 认，但 iOS Safari 从 10 起无视它们 ——
         真正的两道闸在 `src/styles/main.css`（html 的 touch-action）与 `src/main.js`（gesture 事件），
         见 docs/ui.md §18.46。**别把这两档删掉。** -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 三档图标都是 public/favicon.svg 的派生位图（`npm run icons` 生成，别手改那几个二进制）；
         改图标几何或换主题色要重跑，见 docs/ui.md §7。 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PDF Score" />
    <title>PDF Score</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
